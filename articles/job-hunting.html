  <section class="section article">
    <p class="tag">Job Hunting</p>
    <h1>就活で使える自己PRの考え方</h1>

    <p>
      自己PRでは、すごい経験を話すことよりも、自分がどのように考えて行動したかを伝えることが大切です。
    </p>

    <h2>自己PRの基本構成</h2>
    <p>
      まず自分の強みを一言で伝えます。
      その後、具体的な経験、工夫したこと、結果、学んだことの順番で書くと伝わりやすくなります。
    </p>

    <h2>使いやすい経験</h2>
    <p>
      アルバイト、大学の授業、サークル、個人制作、プログラミング経験などは自己PRに使いやすい題材です。
    </p>

    <h2>まとめ</h2>
    <p>
      自己PRは、自分の強みを企業でどう活かせるかまで書けると、より説得力が出ます。
    </p>
