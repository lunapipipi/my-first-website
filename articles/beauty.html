<body>

  <section class="section article">
    <p class="tag">Beauty</p>
    <h1>初心者向けスキンケアの基本</h1>

    <p>
      スキンケアで大切なのは、いきなり高い商品を使うことではなく、
      肌を清潔に保ち、保湿し、紫外線から守ることです。
    </p>

    <h2>基本の順番</h2>
    <p>
      基本的には、洗顔、化粧水、美容液、乳液またはクリームの順番で使います。
      朝は最後に日焼け止めを使うことも大切です。
    </p>

    <h2>毛穴ケアで気をつけること</h2>
    <p>
      毛穴の黒ずみや角栓が気になる場合でも、強くこすりすぎるのは逆効果です。
      酵素洗顔やビタミンC美容液などを少しずつ取り入れるのがおすすめです。
    </p>

    <h2>まとめ</h2>
    <p>
      まずは洗顔、保湿、日焼け止めを安定させることが、きれいな肌への第一歩です。
    </p>
